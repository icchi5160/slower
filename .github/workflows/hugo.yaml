name: Build and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: '0.168.0'
  HUGO_ARCHIVE_SHA256: '787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53'
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source and theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false

      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "${HUGO_ARCHIVE_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Test authoring tools
        run: python3 -m unittest discover -s tests -v

      - name: Build production site
        env:
          HUGO_ENVIRONMENT: production
          # PRでも公開予定URLで検証し、デプロイ時はPagesの実際のURLを優先する。
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://icchi5160.github.io/slower' }}
        run: |
          hugo version
          hugo --gc --minify --panicOnWarning --printPathWarnings --baseURL "${SITE_BASE_URL%/}/"

      - name: Check Markdown and internal links
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://icchi5160.github.io/slower' }}
        run: python3 scripts/blog.py check --site-dir public --base-url "${SITE_BASE_URL%/}/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
          include-hidden-files: false

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
