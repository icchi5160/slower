# icchi5160/slower のGitHub Pagesプロジェクトサイト。
baseURL = 'https://icchi5160.github.io/slower/'
locale = 'ja-JP'
defaultContentLanguage = 'ja'
hasCJKLanguage = true
title = 'Slower'
theme = 'PaperMod'
timeZone = 'Asia/Tokyo'

# 更新日時は記事のlastmodを手動で更新する。未指定時はdateを使用。
[frontmatter]
  lastmod = ['lastmod', 'date']

[params]
  description = '学習・研究・個人開発の記録'
  author = 'icchi5160'
  DateFormat = '2006年1月2日'
  mainSections = ['articles', 'research', 'projects']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  UseHugoToc = true

# Home冒頭の紹介文。
[params.homeInfoParams]
  Content = 'icchi5160の学習・研究・個人開発の記録ブログ'

# GitHubリンクの設定箇所。Aboutにも同じ設定を使用する。
[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/icchi5160'
  title = 'GitHub — icchi5160'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[[menus.main]]
  identifier = 'home'
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  identifier = 'articles'
  name = 'Articles'
  pageRef = '/articles'
  weight = 20

[[menus.main]]
  identifier = 'research'
  name = 'Research'
  pageRef = '/research'
  weight = 40

[[menus.main]]
  identifier = 'projects'
  name = 'Projects'
  pageRef = '/projects'
  weight = 50

[[menus.main]]
  identifier = 'about'
  name = 'About'
  pageRef = '/about'
  weight = 60


[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  ignoreLocation = true
  threshold = 0.2
  minMatchCharLength = 1
  keys = ['title', 'summary', 'content']

[markup.highlight]
  noClasses = false
  lineNos = false
  guessSyntax = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]

[[menus.main]]
  identifier = 'search'
  name = 'Search'
  pageRef = '/search'
  weight = 70
